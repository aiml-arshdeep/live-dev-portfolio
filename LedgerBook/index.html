<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LedgerBook Pro</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <!-- head section(app name and status) -->
        <header class=""app-container">
            <h1>LedgerBook Pro📊</h1>
            <p>BTech WT Project | Status: <span id="sync-status">Connected</span></p>
        </header>
        <!-- 2. Financial Metrics Segment -->
        <section class="metrics-grid">
            <div class="metric-card shadow" id="asset-card">
                <h3>Total Assets</h3>
                <div class="value-display" id="display-assets">₹0.00</div>
            </div>
            
            <div class="metric-card shadow" id="liability-card">
                <h3>Total Liabilities</h3>
                <div class="value-display" id="display-liabilities">₹0.00</div>
            </div>
            
            <div class="metric-card shadow" id="equity-card">
                <h3>Net Equity</h3>
                <div class="value-display" id="display-equity">₹0.00</div>
            </div>
        </section>

        <!-- 3. Workspace Layout: Form & Ledger Display -->
        <div class="workspace-layout">
            
            <!-- Transaction Input Module -->
            <div class="panel-box shadow">
                <h2>Record New Voucher</h2>
                <form id="ledger-form">
                    <div class="input-group">
                        <label for="tx-description">Transaction Description</label>
                        <input type="text" id="tx-description" placeholder="e.g., Office Space Rent" required>
                    </div>

                    <div class="input-group">
                        <label for="tx-category">Account Classification</label>
                        <select id="tx-category">
                            <option value="ASSET">Asset (Cash / Bank Inflow)</option>
                            <option value="LIABILITY">Liability (Creditors / Loans)</option>
                        </select>
                    </div>

                    <div class="input-group">
                        <label for="tx-amount">Amount (INR)</label>
                        <input type="number" id="tx-amount" min="1" step="0.01" placeholder="0.00" required>
                    </div>

                    <button type="submit" class="btn-primary">Execute Entry</button>
                </form>
            </div>
            <!-- Real-Time Ledger Table Module -->
            <div class="panel-box shadow table-overflow">
                <h2>Transaction Journal Ledger</h2>
                <table id="journal-table">
                    <thead>
                        <tr>
                            <th>Description</th>
                            <th>Classification</th>
                            <th>Amount</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody id="journal-body">
                        <!-- JavaScript will inject dynamic rows here -->
                    </tbody>
                </table>
            </div>

        </div> <!-- Closing .workspace-layout -->
    </div> <!-- Closing .app-container -->

    <!-- Dynamic Application Logic Link -->
    <script src="app.js"></script>
</body>
</html>
